<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Yaksh Patel">
  <!--
    Mark: the letter Y drawn as a node graph — a monogram that is also the
    subject of the work (networks, aggregation, signals resolving to one path).
    Nodes are ~2.5x the edge weight so they stay legible as nodes at 16px; the
    vertex is left implied rather than drawn, which kept blobbing at small sizes.
  -->
  <style>
    .tile  { fill: #0c1317; stroke: none; }
    .glyph { fill: #33d6bb; stroke: #33d6bb; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #12181c; stroke: #2a4b47; stroke-width: 1.5; }
    }
  </style>

  <rect class="tile" x=".75" y=".75" width="62.5" height="62.5" rx="15"/>

  <g class="glyph" fill="none" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 17.5L32 36L44 17.5"/>
    <path d="M32 36V47"/>
  </g>
  <g class="glyph" stroke="none">
    <circle cx="20" cy="17.5" r="5.5"/>
    <circle cx="44" cy="17.5" r="5.5"/>
    <circle cx="32" cy="47" r="5.5"/>
  </g>
</svg>
