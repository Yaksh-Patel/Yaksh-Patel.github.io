# ============================================================
#  _config.yml — Site-wide settings
# ============================================================

# ----- IDENTITY -----
title: "Yaksh Patel"

# `tagline` is what jekyll-seo-tag appends to the site title on any page whose
# own title matches it — in practice the homepage, which deliberately carries no
# `title:` front matter so the tab and the search result read
# "Yaksh Patel | Data Science, Machine Learning & Risk".
tagline: "Data Science, Machine Learning & Risk"

# The meta description. Kept near 155 characters so search results don't clip it.
description: >
  Yaksh Patel — data science, machine learning and risk. I build the models
  behind credit, fraud and risk decisions, and keep them reliable in production.

author:
  name: "Yaksh Patel"
  short_name: "Yaksh"
  initials: "YP"
  # Shown on the About page as "<role> · <location>". A field rather than a job
  # title, so it stays true across roles.
  role: "Data Science, Machine Learning & Risk"
  bio: >
    I build the models behind credit, fraud and risk decisions — and care most
    about what happens after they ship.
  location: "Bengaluru, India"
  avatar: "/assets/images/avatar.jpg"
  email: "yaksh.10.patel@gmail.com"
  github: "Yaksh-Patel"
  linkedin: "yvkpatel"
  twitter: "TheYakshPatel"

# One-line positioning used in the hero
hero:
  eyebrow: "Data Science & Analytics · Machine Learning · Risk Management"
  headline_lead: "I build machine learning systems"
  headline_accent: "that survive production."
  blurb: >
    I ship models into high-stakes decision systems — credit, fraud, risk —
    where silent drift is a business problem, not an academic one.
    My work sits on the systems side of ML: feature pipelines, training and
    validation that respect time, serving, monitoring, and the architecture calls
    that decide whether a model holds up under real traffic.
  affiliations: "PayZen · ex-Goldman Sachs · IIT Kharagpur"
  tenure_suffix: "years in data science, machine learning and risk"

# ----- URLS -----
baseurl: ""
url: "https://yaksh-patel.github.io"

# ----- NAVIGATION -----
nav_pages:
  - title: "Home"
    url: "/"
  - title: "About"
    url: "/about/"
  - title: "Work"
    url: "/projects/"
  - title: "Writing"
    url: "/blog/"

# ----- CAREER START -----
# The hero tenure ("4+ years ...") counts from here and steps in six-month
# increments: 3, 3.5, 4, 4.5 ... Jekyll renders the value at build time so the
# page is correct without JavaScript; assets/js/main.js recomputes it on load
# so a site that has not been rebuilt in a while does not go stale.
career:
  start_year: 2022
  start_month: 6

# ----- HOMEPAGE FOCUS CARDS -----
focus_areas:
  - index: "01"
    title: "Production ML systems"
    body: >
      End-to-end ownership: ingestion and feature engineering, training with
      validation that respects temporal ordering, deployment, then the monitoring
      that catches drift before a business metric does.
    tags: [Feature pipelines, Walk-forward validation, MLflow, Drift & PSI monitoring]
  - index: "02"
    title: "Decision systems at scale"
    body: >
      Models that make consequential calls on real money — credit underwriting,
      collections strategy, fraud-ring detection — built to be explainable and
      defensible to the people accountable for the outcome.
    tags: [Credit & fraud, Graph methods, Gradient boosting, Interpretability]
  - index: "03"
    title: "AI engineering"
    body: >
      Building with the current generation of models and tooling, and treating
      them as engineering problems: what the architecture should be, where the
      failure modes hide, and what still needs a human in the loop.
    tags: [LLM applications, AI-assisted development, Evaluation, Deep learning]

# ----- WRITING TOPICS -----
# The Writing section is split by topic. A post joins a topic by listing the
# slug in its `categories` (more than one is fine). Each topic also gets its
# own page, so the URL is shareable and shows up in the sitemap.
#
# To add a topic: add an entry here, then copy any file in blog/topics/ and
# change its `topic:` and `permalink:` to the new slug. Two steps, no plugin.
topics:
  - slug: "ml-systems"
    label: "ML Systems"
    blurb: >
      Production machine learning — feature pipelines, serving, monitoring, and the
      architecture calls that decide whether a model holds up under real traffic.
  - slug: "statistics"
    label: "Statistics"
    blurb: >
      Inference, experiment design and measurement: error rates, power, and what a
      number is actually entitled to claim.
  - slug: "mathematics"
    label: "Mathematics"
    blurb: >
      Linear algebra, probability, optimisation — the machinery underneath the models,
      worked through slowly rather than looked up.
  - slug: "psychology"
    label: "Psychology"
    blurb: >
      How attention, memory and motivation actually behave, and what that implies for
      the tools and habits built on top of them.
  - slug: "philosophy"
    label: "Philosophy"
    blurb: >
      Epistemology, ethics, philosophy of mind — largely the question of what counts as
      knowing something, which turns out to matter when you build models of the world.

# ----- JEKYLL BUILD -----
sass:
  style: compressed

markdown: kramdown
highlighter: rouge
permalink: /blog/:year/:month/:day/:title/

kramdown:
  input: GFM
  syntax_highlighter: rouge
  math_engine: mathjax

mathjax: true

# ----- COLLECTIONS -----
collections:
  projects:
    output: true
    permalink: /projects/:name/

# ----- DEFAULTS -----
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      comments: false
      narrow: true
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project"
      narrow: true

# ----- PLUGINS -----
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# No pagination. The Writing archive is grouped by year and filtered in the
# browser, so slicing it into pages would hide cards the filter is meant to
# find -- and would publish a second copy of the listing at /blog/page2/.

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - tools            # diagram generator; not part of the site output
