# ============================================================
#  _config.yml — Site-wide settings
# ============================================================

# ----- IDENTITY -----
title: "Yaksh Patel"
tagline: "ML Engineering · AI Systems · Production ML"
description: >
  Yaksh Patel — ML engineer building production machine learning systems:
  feature pipelines, model serving, monitoring, and the design decisions that
  keep models reliable under real traffic.

author:
  name: "Yaksh Patel"
  short_name: "Yaksh"
  initials: "YP"
  role: "ML Engineer"
  bio: >
    I build machine learning systems that run in production — and stay correct
    once they get there.
  location: "Bengaluru, India"
  avatar: "/assets/images/avatar.jpg"
  email: "yaksh.10.patel@gmail.com"
  github: "Yaksh-Patel"
  linkedin: "yvkpatel"
  twitter: "TheYakshPatel"

# One-line positioning used in the hero
hero:
  eyebrow: "ML Systems · AI Engineering"
  headline_lead: "I build machine learning systems"
  headline_accent: "that survive production."
  blurb: >
    Four years of shipping models into high-stakes decision systems — credit,
    fraud, risk — where silent drift is a business problem, not an academic one.
    My work sits on the systems side of ML: feature pipelines, training and
    validation that respect time, serving, monitoring, and the architecture calls
    that decide whether a model holds up under real traffic.
  affiliations: "PayZen · ex-Goldman Sachs · IIT Kharagpur"

# ----- URLS -----
baseurl: ""
url: "https://yaksh-patel.github.io"

# ----- NAVIGATION -----
nav_pages:
  - title: "Home"
    url: "/"
  - title: "About"
    url: "/about/"
  - title: "Work"
    url: "/projects/"
  - title: "Writing"
    url: "/blog/"

# ----- HOMEPAGE STATS -----
stats:
  years_experience: 4

# ----- HOMEPAGE FOCUS CARDS -----
focus_areas:
  - index: "01"
    title: "Production ML systems"
    body: >
      End-to-end ownership: ingestion and feature engineering, training with
      validation that respects temporal ordering, deployment, then the monitoring
      that catches drift before a business metric does.
    tags: [Feature pipelines, Walk-forward validation, MLflow, Drift & PSI monitoring]
  - index: "02"
    title: "Decision systems at scale"
    body: >
      Models that make consequential calls on real money — credit underwriting,
      collections strategy, fraud-ring detection — built to be explainable and
      defensible to the people accountable for the outcome.
    tags: [Credit & fraud, Graph methods, Gradient boosting, Interpretability]
  - index: "03"
    title: "AI engineering"
    body: >
      Building with the current generation of models and tooling, and treating
      them as engineering problems: what the architecture should be, where the
      failure modes hide, and what still needs a human in the loop.
    tags: [LLM applications, AI-assisted development, Evaluation, Deep learning]

# ----- BLOG SIDEBAR CATEGORIES -----
sidebar_categories:
  - label: "ml-systems"
    url: "/blog/category/ml-systems/"
  - label: "machine-learning"
    url: "/blog/category/machine-learning/"
  - label: "credit-risk"
    url: "/blog/category/credit-risk/"
  - label: "python"
    url: "/blog/category/python/"
  - label: "statistics"
    url: "/blog/category/statistics/"

# ----- JEKYLL BUILD -----
sass:
  style: compressed

markdown: kramdown
highlighter: rouge
permalink: /blog/:year/:month/:day/:title/

kramdown:
  input: GFM
  syntax_highlighter: rouge
  math_engine: mathjax

mathjax: true

# ----- COLLECTIONS -----
collections:
  projects:
    output: true
    permalink: /projects/:name/

# ----- DEFAULTS -----
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      comments: false
      narrow: true
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project"
      narrow: true

# ----- PLUGINS -----
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-paginate

paginate: 10
paginate_path: "/blog/page:num/"

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
